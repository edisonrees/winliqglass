<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>winliqglass webgl</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  #glass { position: fixed; inset: 0; display: block; }
  .fallback { color: #eef; font: 15px/1.5 system-ui, sans-serif; padding: 24px; }
  .hud {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #eef1f6; font: 600 15px/1.4 system-ui, sans-serif; text-align: center;
    pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.5);
  }
  .hud small { display: block; margin-top: 6px; font-weight: 400; color: #b9c0d0; }
</style>
</head>
<body>
<canvas id="glass"></canvas>
<div class="hud">Liquid Glass, WebGL2<small>move the cursor across the panes</small></div>

<script type="module">
import { WinLiqGlass } from "./winliqglass.js";

const canvas = document.getElementById("glass");
let glass;
try {
  glass = new WinLiqGlass(canvas);
} catch (err) {
  document.body.innerHTML = '<p class="fallback">This demo needs WebGL2.</p>';
  throw err;
}

// The renderer bends whatever is behind it, so it needs something moving to
// refract. Here that is a small offscreen canvas of slow indigo light, drawn
// each frame and handed to the glass as its background. Nothing travels in a
// straight line: each blob rides two frequencies per axis.
const BW = 640, BH = 360;
const bg = document.createElement("canvas");
bg.width = BW;
bg.height = BH;
const b = bg.getContext("2d");
const blobs = [
  { h: "#6f8cff", ax: 0.30, ay: 0.20, fx: 0.00021, fy: 0.00034, p: 0.0 },
  { h: "#59d3c4", ax: 0.24, ay: 0.28, fx: 0.00028, fy: 0.00019, p: 1.7 },
  { h: "#8a6cff", ax: 0.34, ay: 0.16, fx: 0.00016, fy: 0.00026, p: 3.4 },
  { h: "#3a4668", ax: 0.20, ay: 0.30, fx: 0.00024, fy: 0.00030, p: 5.1 },
];
function paintBackground(t) {
  b.globalCompositeOperation = "source-over";
  b.fillStyle = "#0b0d12";
  b.fillRect(0, 0, BW, BH);
  b.globalCompositeOperation = "lighter";
  const r = Math.min(BW, BH) * 0.62;
  for (const o of blobs) {
    const x = BW * (0.5 + o.ax * Math.sin(t * o.fx + o.p) * 0.6 + o.ax * Math.cos(t * o.fy * 1.3 + o.p) * 0.4);
    const y = BH * (0.5 + o.ay * Math.cos(t * o.fy + o.p) * 0.6 + o.ay * Math.sin(t * o.fx * 1.1 + o.p) * 0.4);
    const g = b.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, o.h + "aa");
    g.addColorStop(0.5, o.h + "22");
    g.addColorStop(1, o.h + "00");
    b.fillStyle = g;
    b.beginPath();
    b.arc(x, y, r, 0, Math.PI * 2);
    b.fill();
  }
  b.globalCompositeOperation = "source-over";
}

// A shape record is a rounded rectangle in CSS pixels. The content layer
// defaults (rim -0.12, tint alpha 0.13) are the ones that read as a milky glass
// body with a fine bright edge, taken straight from how the renderer is driven
// in production.
function pane(x, y, w, h, rad) {
  return { x, y, w, h, rad, rot: 0, kind: 1, merge: 0, rim: -0.12, tint: [1, 1, 1, 0.13] };
}

function layout() {
  const W = innerWidth, H = innerHeight;
  glass.resize(W, H);
  const cx = W / 2, cy = H / 2;
  const big = Math.min(460, W - 48);
  glass.setLayers(
    [
      pane(cx - big / 2, cy - 150, big, 300, 28),
      pane(cx - big / 2 - 40, cy + 170, 190, 116, 22),
      pane(cx + big / 2 - 150, cy - 270, 210, 124, 22),
    ],
    [],
    [],
  );
}

layout();
addEventListener("resize", layout);
addEventListener("pointermove", (e) => glass.setTouch(e.clientX, e.clientY, 1));

const started = performance.now();
function frame(now) {
  paintBackground(now - started);
  glass.setBackground(bg);
  glass.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
