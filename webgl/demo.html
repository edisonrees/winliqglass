<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>winliqglass webgl</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  /* The glass canvas sits behind the content. It refracts the moving field, and
     the content on top of it stays bold and bright so it reads against the
     busy, shifting refraction. Clear glass is only for this case: rich media
     behind, strong content in front. */
  #glass { position: fixed; inset: 0; display: block; z-index: 0; }
  .fallback { color: #eef; font: 15px/1.5 system-ui, sans-serif; padding: 24px; position: relative; z-index: 1; }

  .card {
    position: fixed;
    z-index: 1;
    background: transparent;
    color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.35);
  }
  .card.big {
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(460px, calc(100vw - 48px));
    padding: 40px 36px;
    border-radius: 28px;
  }
  .card.big h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .card.big p { margin: 12px 0 0; font-size: 17px; font-weight: 500; color: #eaf0ff; }
  .card.tag {
    padding: 18px 22px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card.tag-a { right: max(24px, 12vw); top: 16vh; color: #cfe0ff; }
  .card.tag-b { left: max(24px, 12vw); bottom: 16vh; color: #c8fff2; }
</style>
</head>
<body>
<canvas id="glass"></canvas>

<div class="card big">
  <h1>Liquid Glass</h1>
  <p>An exact WebGL2 port. Move the cursor across the surface.</p>
</div>
<div class="card tag tag-a">Refractive, not frosted</div>
<div class="card tag tag-b">WebGL2</div>

<script type="module">
import { WinLiqGlass } from "./winliqglass.js";

const canvas = document.getElementById("glass");
let glass;
try {
  glass = new WinLiqGlass(canvas);
} catch (err) {
  document.body.innerHTML = '<p class="fallback">This demo needs WebGL2.</p>';
  throw err;
}

// The renderer bends whatever is behind it, so it needs something moving to
// refract. Here that is a small offscreen canvas of slow indigo light, drawn
// each frame and handed to the glass as its background. Nothing travels in a
// straight line: each blob rides two frequencies per axis.
const BW = 640, BH = 360;
const bg = document.createElement("canvas");
bg.width = BW;
bg.height = BH;
const b = bg.getContext("2d");
const blobs = [
  { h: "#6f8cff", ax: 0.30, ay: 0.20, fx: 0.00021, fy: 0.00034, p: 0.0 },
  { h: "#59d3c4", ax: 0.24, ay: 0.28, fx: 0.00028, fy: 0.00019, p: 1.7 },
  { h: "#8a6cff", ax: 0.34, ay: 0.16, fx: 0.00016, fy: 0.00026, p: 3.4 },
  { h: "#3a4668", ax: 0.20, ay: 0.30, fx: 0.00024, fy: 0.00030, p: 5.1 },
];
function paintBackground(t) {
  b.globalCompositeOperation = "source-over";
  b.fillStyle = "#0b0d12";
  b.fillRect(0, 0, BW, BH);
  b.globalCompositeOperation = "lighter";
  const r = Math.min(BW, BH) * 0.62;
  for (const o of blobs) {
    const x = BW * (0.5 + o.ax * Math.sin(t * o.fx + o.p) * 0.6 + o.ax * Math.cos(t * o.fy * 1.3 + o.p) * 0.4);
    const y = BH * (0.5 + o.ay * Math.cos(t * o.fy + o.p) * 0.6 + o.ay * Math.sin(t * o.fx * 1.1 + o.p) * 0.4);
    const g = b.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, o.h + "aa");
    g.addColorStop(0.5, o.h + "22");
    g.addColorStop(1, o.h + "00");
    b.fillStyle = g;
    b.beginPath();
    b.arc(x, y, r, 0, Math.PI * 2);
    b.fill();
  }
  b.globalCompositeOperation = "source-over";
}

// Read the glass shapes straight off the laid out content, the way it is driven
// in production: every card is a rounded rectangle, and the refraction agrees
// with exactly where the browser painted the box. The content layer defaults
// (rim -0.12, tint alpha 0.13) are the milky glass body with a fine bright edge.
function readShapes() {
  const shapes = [];
  for (const el of document.querySelectorAll(".card")) {
    const rect = el.getBoundingClientRect();
    if (rect.width < 8 || rect.height < 8) continue;
    const rad = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
    shapes.push({
      x: rect.left,
      y: rect.top,
      w: rect.width,
      h: rect.height,
      rad,
      rot: 0,
      kind: 1,
      merge: 0,
      rim: -0.12,
      tint: [1, 1, 1, 0.13],
    });
  }
  return shapes;
}

function layout() {
  glass.resize(innerWidth, innerHeight);
  glass.setLayers(readShapes(), [], []);
}

layout();
addEventListener("resize", layout);
addEventListener("pointermove", (e) => glass.setTouch(e.clientX, e.clientY, 1));

const started = performance.now();
function frame(now) {
  paintBackground(now - started);
  glass.setBackground(bg);
  glass.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
